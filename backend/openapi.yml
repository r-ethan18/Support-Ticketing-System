openapi: 3.1.0
info:
  title: Support Ticketing System API
  description: REST API for the support ticketing system. Authenticate via `POST /api/v1/auth/token`
    and send the token as a Bearer header.
  version: 0.1.0
paths:
  /api/v1/auth/token:
    post:
      tags:
      - auth
      summary: Exchange credentials for an access token
      description: 'Public endpoint. Send the returned token as `Authorization: Bearer
        <token>`.


        Repeated failures for the same account and client address are locked out

        for a while (429).'
      operationId: create_access_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed attempts; see `Retry-After`
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for a new token pair
      description: 'Refresh tokens are single-use: the response carries a replacement.
        The new access token has the person''s *current* role. Sending a token that
        was already used revokes that whole session.'
      operationId: refresh_access_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a refresh token's session
      description: Idempotent. Access tokens already issued stay valid until they
        expire.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Create a requester account
      description: Public self-service sign-up. Always creates a `requester`.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get the authenticated person
      operationId: get_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - AccessToken: []
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Change the authenticated person's password
      description: Revokes all of the person's refresh tokens, so other devices must
        log in again.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Current password is wrong, or the new one is unchanged
        '429':
          description: Too many wrong current passwords; see `Retry-After`
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AccessToken: []
  /api/v1/admins:
    post:
      tags:
      - admins
      summary: Create an admin (admin only)
      description: Creates a person with role `admin` and the given password.
      operationId: create_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AccessToken: []
  /api/v1/people:
    get:
      tags:
      - people
      summary: List people (supervisor or admin)
      operationId: list_people
      security:
      - AccessToken: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          title: Role
      - name: vendorId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendorid
      - name: departmentId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Departmentid
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match on name or email
          title: Q
        description: Match on name or email
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/people/{person_id}/role:
    put:
      tags:
      - people
      summary: Assign a person's role (admin only)
      description: Everyone signs up as a `requester`; an admin promotes them. A `supervisor`
        needs a `departmentId`; an `assignee` (a vendor's technician) needs a `vendorId`.
        Setting `requester` clears both. Admin accounts are created with `POST /admins`
        and their role cannot be changed here. The person's access token keeps its
        old role until it expires or is refreshed. An assignee who changes role or
        vendor is taken off their tickets, and a supervisor who changes role or department
        stops supervising their tickets.
      operationId: assign_role
      security:
      - AccessToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Person Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/people/{person_id}:
    get:
      tags:
      - people
      summary: Get a person
      description: Staff profiles are visible to everyone. A requester's profile is
        visible to that requester, supervisors, admins, and an assignee currently
        assigned to one of their tickets.
      operationId: get_person
      security:
      - AccessToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Person Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - people
      summary: Delete a person (admin only)
      description: 'Admin accounts cannot be deleted here. Nothing other people are
        involved in is destroyed: the person''s tickets, comments, uploads, history
        and past assignments stay, with the person shown as a deleted user (`null`
        id). Only closed tickets nobody else touched are removed. An assignee is first
        taken off the tickets they are on (a ticket left with nobody goes back to
        `open`), and a supervisor''s tickets lose their supervisor.'
      operationId: delete_person
      security:
      - AccessToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Person Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/vendors:
    get:
      tags:
      - vendors
      summary: List vendors
      description: 'Employees of a vendor: `GET /people?vendorId=...`.'
      operationId: list_vendors
      security:
      - AccessToken: []
      parameters:
      - name: assetId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Vendors responsible for this asset
          title: Assetid
        description: Vendors responsible for this asset
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match on name
          title: Q
        description: Match on name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPage'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - vendors
      summary: Create a vendor (admin only)
      operationId: create_vendor
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/vendors/{vendor_id}:
    get:
      tags:
      - vendors
      summary: Get a vendor
      operationId: get_vendor
      security:
      - AccessToken: []
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Vendor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - vendors
      summary: Delete a vendor (admin only)
      description: Fails with 409 while the vendor is responsible for any asset. Its
        technicians are taken off their tickets (a ticket left with nobody reopens)
        and become plain requesters.
      operationId: delete_vendor
      security:
      - AccessToken: []
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Vendor Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/departments:
    get:
      tags:
      - departments
      summary: List departments
      description: 'Owned assets: `GET /assets?departmentId=...`. Supervisors: `GET
        /people?departmentId=...`.'
      operationId: list_departments
      security:
      - AccessToken: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match on name
          title: Q
        description: Match on name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPage'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - departments
      summary: Create a department (admin only)
      operationId: create_department
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/departments/{department_id}:
    get:
      tags:
      - departments
      summary: Get a department
      operationId: get_department
      security:
      - AccessToken: []
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Department Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - departments
      summary: Delete a department (admin only)
      description: Fails with 409 while the department owns assets. Its supervisors
        become plain requesters.
      operationId: delete_department
      security:
      - AccessToken: []
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Department Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories:
    get:
      tags:
      - categories
      summary: List categories
      description: 'Specialised assignees: `GET /people?categoryId=...`. Assets: `GET
        /assets?categoryId=...`.'
      operationId: list_categories
      security:
      - AccessToken: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match on name
          title: Q
        description: Match on name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - categories
      summary: Create a category (admin only)
      operationId: create_category
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller's role may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories/{category_id}:
    get:
      tags:
      - categories
      summary: Get a category
      operationId: get_category
      security:
      - AccessToken: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - categories
      summary: Delete a category (admin only)
      description: Fails with 409 while people, assets or tickets still refer to it.
      operationId: delete_category
      security:
      - AccessToken: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
