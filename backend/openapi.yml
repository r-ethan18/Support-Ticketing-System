                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: File storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/attachments/{attachment_id}/content:
    get:
      tags:
      - tickets
      summary: Download an attachment's file
      description: Streams the uploaded file. Visible to anyone who can see the ticket.
      operationId: get_ticket_attachment_content
      security:
      - AccessToken: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: The file
          content:
            application/pdf: {}
            image/gif: {}
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: File storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/comments:
    get:
      tags:
      - tickets
      summary: List a ticket's comments
      description: Oldest first. Visible to everyone who can see the ticket.
      operationId: list_ticket_comments
      security:
      - AccessToken: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketComment'
                title: Response List Ticket Comments
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - tickets
      summary: Comment on a ticket
      description: 'The ticket''s chat: its requester, supervisors, current assignees
        and admins can post. Closed tickets are read-only.'
      operationId: create_ticket_comment
      security:
      - AccessToken: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCommentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/status-history:
    get:
      tags:
      - tickets
      summary: List a ticket's status changes
      operationId: list_ticket_status_history
      security:
      - AccessToken: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketStatusHistoryEntry'
                title: Response List Ticket Status History
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/stream:
    get:
      tags:
      - tickets
      summary: SSE stream of live updates for a ticket
      description: 'Server-Sent Events endpoint. Connect with `EventSource` (with
        an Authorization header via a custom fetch). Emits `comment` events when a
        new comment is posted and `status` events when the ticket status changes,
        `assignment` events when assignees change, `resync` when the client fell behind
        and should reload, and `deleted`/`closed` just before the server ends the
        stream (ticket deleted, or the caller lost access). A `connected` event is
        sent immediately on connection, and a `: heartbeat` comment every 25 s keeps
        the connection alive; access is re-checked at each heartbeat.'
      operationId: stream_ticket
      security:
      - AccessToken: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
