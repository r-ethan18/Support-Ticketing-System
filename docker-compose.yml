services:
  traefik:
    image: traefik:v3.6
    container_name: sts-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sts-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sts-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET (>= 32 chars) in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?set ADMIN_EMAIL (first admin) in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD (first admin, >= 12 chars) in .env}
      - DB_HOST=sts-db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-sts}
      - DB_USER=${POSTGRES_USER:-sts}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - S3_ENDPOINT=garage:3900
      - S3_REGION=garage
      - S3_BUCKET=sts-attachments
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY (GK + 32 hex chars) in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY (64 hex chars) in .env}
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - sts-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=HostRegexp(`.+`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.routers.backend.priority=100
      - traefik.http.services.backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sts-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - sts-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=HostRegexp(`.+`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000

  db:
    image: postgres:17
    container_name: sts-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sts}
      - POSTGRES_USER=${POSTGRES_USER:-sts}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      sts-network:
        aliases:
          - db

  # Attachment storage (S3-compatible). Not routed by Traefik: files are served
  # by the backend. Same config file as the cluster (k8s/base/garage.toml).
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: sts-garage
    restart: unless-stopped
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (64 hex chars) in .env}
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY (GK + 32 hex chars) in .env}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY (64 hex chars) in .env}
      - GARAGE_DEFAULT_BUCKET=sts-attachments
    volumes:
      - ./k8s/base/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sts-network

networks:
  sts-network:
    name: sts-network
    driver: bridge

volumes:
  postgres_data:
  garage_meta:
  garage_data:
