---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The PodMonitor and NetworkPolicy select the backend pods, so they live in the
# same namespace as the workloads.
namespace: sts-prod

resources:
  - backend-podmonitor.yaml
  - backend-networkpolicy.yaml

# Grafana's dashboard sidecar loads any ConfigMap labelled grafana_dashboard=1
# (it watches all namespaces). The name hash is off so the label and name stay
# stable across edits.
configMapGenerator:
  - name: sts-backend-dashboard
    files:
      - dashboards/backend.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
