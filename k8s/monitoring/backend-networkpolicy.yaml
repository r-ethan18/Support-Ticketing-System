# Once a pod is selected by an Ingress policy, everything not listed is denied,
# so this also states who may reach the API port. Adjust the namespace labels
# to where the ingress controller and Prometheus run. The ingress controller is
# allowed from `traefik` (Helm install) and `kube-system` (K3s ships Traefik
# there).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sts-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sts-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - traefik
                  - kube-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9100
