---
# Ingress using Traefik as the ingress controller.
#
# Routing rules (order matters for Traefik path-based priority):
#   /api  → backend Service on port 8000
#   /     → frontend Service on port 3000
#
# The backend's FastAPI routes live under /api/v1/ (e.g. /api/v1/auth/token).
# Traefik uses longest-prefix matching, so /api has higher specificity than /
# and will not be sent to the frontend.
#
# Path rewriting: The backend expects to receive requests with the /api prefix
# intact (all routes are declared under /api/v1/). No path strip is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sts-ingress
  annotations:
    # Raise the /api rule priority so it is evaluated before the catch-all /.
    # Traefik respects this annotation on Ingress resources.
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
