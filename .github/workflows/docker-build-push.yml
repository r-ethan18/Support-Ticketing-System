name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─── Permissions ──────────────────────────────────────────────────────────────
# contents: write  — needed to commit the updated kustomization.yaml back to main
# packages: write  — needed to push images to GHCR
permissions:
  contents: write
  packages: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and push both images (fan-out via matrix)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/${{ github.repository }}-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository }}-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Update image tags in the production Kustomize overlay
  #
  # Runs after both matrix jobs complete successfully.
  # Commits the updated kustomization.yaml back to main with [skip ci] so the
  # commit does not re-trigger this workflow.
  #
  # Branch-protection note:
  #   If branch protection on `main` requires status checks or PR reviews,
  #   GITHUB_TOKEN cannot push directly. In that case, either:
  #     a) Exempt the Actions bot from the branch-protection rule, OR
  #     b) Use a PAT stored as a repository secret (e.g. ACTIONS_PAT) and
  #        replace `secrets.GITHUB_TOKEN` with `secrets.ACTIONS_PAT` in the
  #        "Push updated kustomization" step.
  # ────────────────────────────────────────────────────────────────────────────
  update-image-tags:
    name: Update Kustomize Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Use GITHUB_TOKEN (write) so the commit is attributed to the
          # github-actions bot and does not create an infinite loop when
          # combined with [skip ci].
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tag
        id: tag
        # docker/metadata-action's type=sha produces: sha-<7-char-short-sha>
        run: echo "value=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update backend image tag
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image \
            ghcr.io/r-ethan18/support-ticketing-system-backend=ghcr.io/r-ethan18/support-ticketing-system-backend:${{ steps.tag.outputs.value }}

      - name: Update frontend image tag
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image \
            ghcr.io/r-ethan18/support-ticketing-system-frontend=ghcr.io/r-ethan18/support-ticketing-system-frontend:${{ steps.tag.outputs.value }}

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet k8s/overlays/production/kustomization.yaml \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated kustomization
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(k8s): update image tags to ${{ steps.tag.outputs.value }} [skip ci]"
          git push origin main
