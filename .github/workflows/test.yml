name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sts
          POSTGRES_USER: sts
          POSTGRES_PASSWORD: sts-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sts -d sts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and remove their own rows; the app applies schema.sql on
      # startup. REQUIRE_DB turns "database unreachable" into a failure, not a skip.
      REQUIRE_DB: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sts
      DB_USER: sts
      DB_PASSWORD: sts-ci-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest 

  frontend-test:
    name: Frontend (Lint & Format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm exec biome check .
