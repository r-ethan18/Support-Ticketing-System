name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sts
          POSTGRES_USER: sts
          POSTGRES_PASSWORD: sts-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sts -d sts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and remove their own rows; the app applies schema.sql on
      # startup. REQUIRE_DB turns "database unreachable" into a failure, not a skip.
      REQUIRE_DB: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sts
      DB_USER: sts
      DB_PASSWORD: sts-ci-password
      # Throwaway credentials for the Garage container started below, which
      # creates this key and bucket itself. REQUIRE_STORAGE makes the storage
      # tests fail, not skip, if Garage is not reachable.
      REQUIRE_STORAGE: "1"
      S3_ENDPOINT: localhost:3900
      S3_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_BUCKET: sts-attachments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Not a `services:` entry: Garage needs garage.toml mounted from the repo.
      - name: Start Garage
        run: |
          docker run -d --name garage -p 3900:3900 \
            -v "$GITHUB_WORKSPACE/k8s/base/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET=fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 \
            -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
          for _ in $(seq 30); do
            docker exec garage /garage status >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs garage
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest 

  frontend-test:
    name: Frontend (Lint & Format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm exec biome check .
